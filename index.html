<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Game Fisika</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: white;
    }
    #ball {
      width: 80px;
      height: 80px;
      background: red;
      border-radius: 50%;
      margin: 20px auto;
      cursor: pointer;
    }
    #question {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1>🎮 Game Klik Fisika</h1>
<p>Skor: <span id="score">0</span></p>
<p>Waktu: <span id="time">10</span></p>

<div id="ball"></div>

<div id="question">
  <h2>Soal Fisika</h2>
  <p>Sebuah benda bergerak 5 m/s selama 4 detik. Berapa jaraknya?</p>
  <input type="number" id="answer">
  <br><br>
  <button onclick="cek()">Jawab</button>
</div>

<script>
let score = 0;
let time = 10;

document.getElementById("ball").onclick = () => {
  score++;
  document.getElementById("score").innerText = score;
};

let timer = setInterval(() => {
  time--;
  document.getElementById("time").innerText = time;
  if (time === 0) {
    clearInterval(timer);
    document.getElementById("ball").style.display = "none";
    document.getElementById("question").style.display = "block";
  }
}, 1000);

function cek() {
  let jawab = document.getElementById("answer").value;
  if (jawab == 20) {
    alert("Benar! 🎉");
    location.reload();
  } else {
    alert("Salah 😢 Game Over");
  }
}
</script>

</body>
</html>
